[package]
name = "astra-desktop"
version = "0.1.0"
description = "Astra — every agent, one workspace (desktop, iOS and Android shell)"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.88"

# Not a member of the root workspace: it needs the system webview (webkit2gtk on Linux) to build.
[workspace]

[lib]
name = "astra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-os = "2.4.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-opener = "2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["sync"] }
# Signing in with GitHub from the app (device flow; same build as the runtime's).
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
astra-protocol = { path = "../../../crates/astra-protocol" }

# Phones keep a replica and sync it; only desktops run agents.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
astra-node = { path = "../../../crates/astra-node", default-features = false }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
astra-node = { path = "../../../crates/astra-node", features = ["runtime"] }
# The in-app terminal (desktop only).
portable-pty = "0.9.0"
# The GitHub token for listing and cloning your repositories (OS keychain; same version as the runtime's).
keyring = "4"
# The code editor's diff against the last commit (same build as the runtime's).
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2", "https"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
