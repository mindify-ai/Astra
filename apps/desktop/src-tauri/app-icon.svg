<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Desktop icon: the Astra mark (a planet and its moon) on a black tile, on the macOS icon grid
       (824px tile, 100px margin, room for the drop shadow). The moon is the one signal-green element. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B8B8B8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8CD44A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8CD44A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#B5EC7E"/>
      <stop offset="1" stop-color="#7AC142"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#0D0D0D"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <g clip-path="url(#clip)">
    <!-- Faint outer orbits, as on the Welcome screen. -->
    <circle cx="492" cy="532" r="300" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="4"/>
    <circle cx="492" cy="532" r="388" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="4"/>
    <circle cx="674" cy="428" r="170" fill="url(#glow)"/>
  </g>

  <!-- The mark: LogoMark scaled ×26 (planet r=8, moon r=2.5 at +7,−4). -->
  <circle cx="492" cy="532" r="208" fill="none" stroke="url(#ring)" stroke-width="44"/>
  <!-- A black gap cuts the moon out of the ring. -->
  <circle cx="674" cy="428" r="90" fill="#0D0D0D"/>
  <circle cx="674" cy="428" r="65" fill="url(#moon)"/>
</svg>
