<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- iOS and Android icon: full bleed (the OS applies its own mask). The same art as app-icon.svg, drawn in its
       coordinates and scaled ×1.2115 about the centre, so the ring is r=252 centred on the icon. -->
  <defs>
    <radialGradient id="space" cx="0.34" cy="0.24" r="0.95">
      <stop offset="0" stop-color="#1E2225"/>
      <stop offset="0.5" stop-color="#0C0E0F"/>
      <stop offset="1" stop-color="#040505"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="chamfer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ambient" cx="694" cy="408" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8CD44A" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#8CD44A" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8CD44A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8CD44A" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#8CD44A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8CD44A" stop-opacity="0"/>
    </radialGradient>
    <!-- Brushed titanium: alternating bands read as anisotropic reflections around the ring. -->
    <linearGradient id="titanium" x1="0.08" y1="0.02" x2="0.92" y2="0.98">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.16" stop-color="#E4E8EA"/>
      <stop offset="0.34" stop-color="#9AA0A4"/>
      <stop offset="0.48" stop-color="#F3F5F6"/>
      <stop offset="0.62" stop-color="#868C90"/>
      <stop offset="0.8" stop-color="#C4C9CC"/>
      <stop offset="1" stop-color="#5E6367"/>
    </linearGradient>
    <linearGradient id="bevelOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="bevelInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <!-- The moon's light falling on the ring and the planet's limb. -->
    <radialGradient id="spill" cx="694" cy="408" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B5EC7E" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#8CD44A" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8CD44A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.36" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#1A1E21"/>
      <stop offset="0.7" stop-color="#090A0B"/>
      <stop offset="1" stop-color="#050606"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#F7FFEC"/>
      <stop offset="0.25" stop-color="#CFF7A6"/>
      <stop offset="0.6" stop-color="#92D850"/>
      <stop offset="0.9" stop-color="#5FA62E"/>
      <stop offset="1" stop-color="#4A8A22"/>
    </radialGradient>
    <linearGradient id="moonRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.45" stop-color="#E2FFC4" stop-opacity="0"/>
      <stop offset="1" stop-color="#E2FFC4" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9FFB0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#EFFFDC" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#D9FFB0" stop-opacity="0"/>
    </linearGradient>

    <filter id="ringShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.75"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="haze" x="-10%" y="-400%" width="120%" height="900%"><feGaussianBlur stdDeviation="2"/></filter>

    <!-- A clean gap cuts the moon out of the ring, showing the tile through it. -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <circle cx="694" cy="408" r="90" fill="#000000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#space)"/>
  <g transform="matrix(1.2115 0 0 1.2115 -108.29 -108.29)">
      <rect x="100" y="100" width="824" height="824" fill="url(#ambient)"/>

      <!-- Star field: sparse and dim. -->
      <g fill="#FFFFFF">
        <circle cx="252" cy="236" r="2.4" opacity="0.4"/>
        <circle cx="336" cy="178" r="1.4" opacity="0.25"/>
        <circle cx="846" cy="752" r="1.8" opacity="0.25"/>
        <circle cx="296" cy="836" r="1.6" opacity="0.2"/>
        <circle cx="176" cy="604" r="1.4" opacity="0.22"/>
        <circle cx="736" cy="874" r="1.4" opacity="0.18"/>
        <circle cx="858" cy="214" r="1.6" opacity="0.3"/>
      </g>

      <!-- Instrument dial: minor ticks every 5°, majors every 30°, on the inner orbit. -->
      <circle cx="512" cy="512" r="300" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
      <circle cx="512" cy="512" r="312" fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="12"
              stroke-dasharray="1.6 25.63" transform="rotate(-90 512 512)"/>
      <circle cx="512" cy="512" r="316" fill="none" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="22"
              stroke-dasharray="3.2 162.27" transform="rotate(-90.3 512 512)"/>
      <!-- Outer orbit, broken into four arcs. -->
      <circle cx="512" cy="512" r="388" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"
              stroke-dasharray="560 49.5" transform="rotate(-82 512 512)"/>

      <circle cx="694" cy="408" r="190" fill="url(#glow)"/>
      <rect x="0" y="0" width="1024" height="560" fill="url(#sheen)"/>

    <!-- The mark: LogoMark scaled ×26 (planet r=8, moon r=2.5 at +7,−4). -->
    <g mask="url(#gap)">
      <circle cx="512" cy="512" r="186" fill="url(#planet)"/>
      <circle cx="512" cy="512" r="183" fill="none" stroke="url(#spill)" stroke-width="8" opacity="0.45" filter="url(#soft)"/>
      <circle cx="512" cy="512" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2"/>
      <g filter="url(#ringShadow)">
        <circle cx="512" cy="512" r="208" fill="none" stroke="url(#titanium)" stroke-width="44"/>
      </g>
      <circle cx="512" cy="512" r="208" fill="none" stroke="url(#spill)" stroke-width="44" opacity="0.3"
              style="mix-blend-mode:screen"/>
      <circle cx="512" cy="512" r="229" fill="none" stroke="url(#bevelOuter)" stroke-width="2.5"/>
      <circle cx="512" cy="512" r="187" fill="none" stroke="url(#bevelInner)" stroke-width="2.5"/>
    </g>

    <!-- The moon: an emissive core with bloom, rim light and an anamorphic streak. -->
    <circle cx="694" cy="408" r="74" fill="#8CD44A" opacity="0.75" filter="url(#bloom)"/>
    <rect x="474" y="405" width="440" height="6" rx="3" fill="url(#streak)" opacity="0.55" filter="url(#haze)"/>
    <circle cx="694" cy="408" r="65" fill="url(#moon)"/>
    <circle cx="694" cy="408" r="63.5" fill="none" stroke="url(#moonRim)" stroke-width="3"/>
    <ellipse cx="674" cy="384" rx="14" ry="9" fill="#FFFFFF" opacity="0.4" transform="rotate(-32 674 384)"
             filter="url(#soft)"/>
  </g>
</svg>
