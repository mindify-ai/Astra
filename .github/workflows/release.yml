name: Release apps

# Builds installers for every platform. Run by hand, or push a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { name: macOS (Intel), os: macos-latest, args: "--target x86_64-apple-darwin" }
          - { name: Windows, os: windows-latest, args: "" }
          - { name: Linux, os: ubuntu-22.04, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: pnpm install --frozen-lockfile
      # macOS signing. Tauri treats an empty APPLE_* variable as set: an empty APPLE_SIGNING_IDENTITY overrides
      # the ad-hoc identity ("-") in tauri.conf.json, and the app ships with no sealed bundle signature, which
      # Gatekeeper reports as "Astra.app is damaged and can't be opened". So export the Apple variables only when
      # the secrets exist. Without them the app is ad-hoc signed: it opens after "Open Anyway" instead of being
      # rejected as damaged. With them it is signed with the Developer ID and notarized.
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          put() { { echo "$1<<__ASTRA_EOF__"; printenv "$1"; echo "__ASTRA_EOF__"; } >> "$GITHUB_ENV"; }
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            put APPLE_CERTIFICATE; put APPLE_CERTIFICATE_PASSWORD; put APPLE_SIGNING_IDENTITY
            echo "ASTRA_MAC_SIGNED=1" >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              put APPLE_ID; put APPLE_PASSWORD; put APPLE_TEAM_ID
              echo "Signing with the Developer ID and notarizing."
            else
              echo "::warning::Signing with the Developer ID but not notarizing (APPLE_ID, APPLE_PASSWORD or APPLE_TEAM_ID is missing). Gatekeeper will still block downloads."
            fi
          else
            echo "::warning::No Developer ID secrets: the macOS app is ad-hoc signed. Users must allow it once in System Settings > Privacy & Security > Open Anyway."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Astra ${{ github.ref_name }}
          releaseBody: |
            **Install on a Mac with Apple silicon** (one line, no security prompt):

            ```bash
            curl -fsSL https://astra.mindifyai.dev/install.sh | sh
            ```

            If you download the `.dmg` in a browser instead and this build isn't notarized yet, macOS says Apple can't
            verify Astra the first time you open it. Open **System Settings → Privacy & Security** and click
            **Open Anyway** (or run `xattr -dr com.apple.quarantine /Applications/Astra.app` once).
          releaseDraft: true
      # Fail the job (the release stays a draft) if the bundle's signature is broken, which is what makes
      # Gatekeeper call the app "damaged". Checks the .app and the copy inside the .dmg that users download.
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bundle_dir=$(find apps/desktop/src-tauri/target -type d -path '*/release/bundle' | head -n1)
          app="$bundle_dir/macos/Astra.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Identifier|Authority|Signature|TeamIdentifier)='
          for dmg in "$bundle_dir"/dmg/*.dmg; do
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
            codesign --verify --deep --strict --verbose=2 "$mnt/Astra.app"
            hdiutil detach "$mnt" > /dev/null
          done
          if [ "${ASTRA_MAC_SIGNED:-}" = "1" ] && [ -n "${APPLE_ID:-}" ]; then
            spctl --assess --type execute --verbose=2 "$app"
          fi

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          { targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build APK
        env: { NDK_HOME: "${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973" }
        working-directory: apps/desktop
        run: pnpm tauri android init --ci && pnpm tauri android build --apk --ci
      - uses: actions/upload-artifact@v4
        with: { name: android, path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk }

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios,aarch64-apple-ios-sim" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build for the simulator (device builds need APPLE_DEVELOPMENT_TEAM)
        working-directory: apps/desktop
        env: { APPLE_DEVELOPMENT_TEAM: "${{ secrets.APPLE_TEAM_ID }}" }
        run: pnpm tauri ios init --ci && pnpm tauri ios build --target aarch64-sim --ci

  server-image:
    name: Server container
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/astra-server/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: ghcr.io/${{ github.repository_owner }}/astra-server:${{ github.ref_name }}
